<!DOCTYPE html>

<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title> DevFlix</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <header class ="Navbar">
        <h1 class ="logo">Dev <span>Flix</span></h1>
    </header>

    <section class="container">
        <div class="section-title">
            <h2>Catálogo de filmes</h2>
        </div>

        <div class="grid-filmes">
            {% for filme in filmes %}
                <div class="card">
                  <div class="card-content">
                    <h3>{{ filme.titulo }}</h3>
                    <img src="{{ filme.capa_url}}" class="card-img" alt="{{ filme.titulo }}">
                      <p> <strong>Gênero:</strong>{{filme.geneto}}</p>
                      <p><strong>Lançamento:</strong>{{filme.ano_lancamento}}</p>
                      <p><strong>Nota:</strong>{{filme.nota}}</p>
                  </div>
                </div>
                {% else %}
                <div class="empty-menssage">
                    <h3>Nenhum filme está disponível</h3>
                </div>
            {% endfor %}
        </div>
    </section>

    
    
        
    

    <footer>
        <p>&copy; 2024 DevFlix. Todos os direitos reservados.</p>
    </footer>
</html>
